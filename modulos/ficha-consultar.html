<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Fichas Técnicas | Transporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
/* ============================================ */
/* ESTILOS GENERALES Y TABLA                    */
/* ============================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Roboto', sans-serif; background: #f5f5f5; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* Filtros */
.filters-bar {
  display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;
  background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.filter-input, .filter-select {
  padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
}
.filter-input { flex: 1; min-width: 200px; }
.filter-select { min-width: 150px; cursor: pointer; }
.filter-input:focus, .filter-select:focus { outline: none; border-color: #003366; box-shadow: 0 0 0 2px rgba(0,51,102,0.1); }

/* Tabla */
.table-container {
  background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;
}
.data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.data-table th {
  background: #003366; color: white; padding: 12px 10px; text-align: left; font-weight: 600;
}
.data-table td {
  padding: 12px 10px; border-bottom: 1px solid #eee; color: #333;
}
.data-table tr:hover { background: #f8f9fa; }
.badge {
  padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase;
}
.badge-operativo { background: #d4edda; color: #155724; }
.badge-inoperativo { background: #f8d7da; color: #721c24; }
.badge-desincorporado { background: #e2e3e5; color: #383d41; }
.badge-taller { background: #fff3cd; color: #856404; }

.btn-detail {
  padding: 6px 12px; background: #003366; color: white; border: none; border-radius: 4px;
  cursor: pointer; font-size: 13px; transition: 0.2s;
}
.btn-detail:hover { background: #004080; }

/* Paginación */
.pagination {
  display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0;
}
.page-btn {
  padding: 8px 14px; border: 1px solid #ddd; background: white; border-radius: 4px;
  cursor: pointer; transition: 0.2s; font-weight: 500;
}
.page-btn:hover { background: #e9ecef; }
.page-btn.active { background: #003366; color: white; border-color: #003366; }
.page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.page-info { color: #666; font-size: 14px; margin: 0 10px; }

/* Estado vacío / Carga */
.loading, .empty-state { text-align: center; padding: 40px; color: #666; }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #ccc; border-top-color: #003366; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================ */
/* MODAL DETALLE                                */
/* ============================================ */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
  display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-content {
  background: white; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto;
  border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); position: relative;
}
.modal-header {
  background: #003366; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 10;
}
.modal-header h3 { margin: 0; font-size: 16px; }
.btn-close, .btn-print {
  background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px;
}
.btn-print { background: #2a9d8f; padding: 6px 14px; font-size: 13px; border-radius: 4px; display: flex; align-items: center; gap: 5px; }
.btn-print:hover { background: #218838; }
.modal-body { padding: 20px; }
.ficha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
.ficha-item label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 500; }
.ficha-item span { font-size: 14px; font-weight: 600; color: #333; background: #f8f9fa; padding: 6px 10px; border-radius: 4px; display: block; }
.photos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
.photo-box { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; text-align: center; }
.photo-box img { width: 100%; height: 120px; object-fit: cover; display: block; }
.photo-box span { display: block; padding: 5px; font-size: 12px; color: #666; background: #f8f9fa; }

/* ============================================ */
/* ESTILOS DE IMPRESIÓN                         */
/* ============================================ */
@media print {
  .navbar, .module-header, .filters-bar, .table-container, .pagination, .modal-header, .btn-close { display: none !important; }
  .modal-overlay { position: static; background: none; padding: 0; display: block !important; }
  .modal-content { max-height: none; box-shadow: none; border-radius: 0; }
  body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .modal-body { padding: 0; }
  .photo-box img { max-height: 150px; }
}
</style>
</head>
<body class="dashboard-page">

<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <img src="../img/logo.png" alt="Logo" class="nav-logo" width="35" height="35">
      <span class="nav-title">Sistema Automatizado || Gestión Administrativa del CCPE ZULIA</span>
    </div>
    <div class="nav-user">
      <span class="user-email" id="userEmail">Cargando...</span>
      <button class="btn-logout" id="logoutBtn"><span>🚪</span> Cerrar Sesión</button>
    </div>
  </div>
</nav>

<main class="dashboard-main">
  <header class="module-header">
    <div class="breadcrumb">
      <a href="../dashboard.html">🏠 Dashboard</a> /
      <a href="transporte.html">Transporte</a> /
      <span class="breadcrumb-current">Consultar Fichas</span>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="window.location.href='ficha-crear.html'">➕ Nueva Ficha</button>
  </header>

  <div class="container">
    <div class="filters-bar">
      <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Buscar por placa, marca, modelo o dependencia...">
      <select id="tipoFilter" class="filter-select">
        <option value="todos">📦 Todos</option>
        <option value="motos">🏍️ Motos</option>
        <option value="vehiculos">🚗 Vehículos</option>
      </select>
      <select id="estatusFilter" class="filter-select">
        <option value="todos">🟢 Todos los Estatus</option>
        <option value="OPERATIVO">OPERATIVO</option>
        <option value="INOPERATIVO">INOPERATIVO</option>
        <option value="DESINCORPORADO">DESINCORPORADO</option>
        <option value="REPARACION">REPARACIÓN</option>
      </select>
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Placa</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Tipo</th>
            <th>Color</th>
            <th>Estatus</th>
            <th>Dependencia</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="fichasTableBody">
          <!-- Datos dinámicos -->
        </tbody>
      </table>
      <div id="loadingState" class="loading"><div class="spinner"></div> Cargando fichas...</div>
      <div id="emptyState" class="empty-state" style="display:none;">📭 No se encontraron fichas con los filtros aplicados.</div>
    </div>

    <div class="pagination" id="paginationControls"></div>
  </div>
</main>

<!-- MODAL DETALLE -->
<div class="modal-overlay" id="fichaModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📄 Ficha Técnica - Detalle</h3>
      <div style="display:flex; gap:10px;">
        <button class="btn-print" onclick="imprimirFicha()">🖨️ Imprimir</button>
        <button class="btn-close" onclick="cerrarModal()">✖</button>
      </div>
    </div>
    <div class="modal-body" id="fichaDetailBody">
      <!-- Contenido inyectado por JS -->
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="ficha-consultar.js"></script>
</body>
</html>
